<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe — EduBulletin</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root{--ink:#0d1117;--cream:#f5f0e8;--gold:#c9a84c;--mist:#e8edf2;--muted:#6b7685;--border:#e8edf2;--rust:#c4622d;--green:#228B22;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--cream);min-height:100vh;display:flex;flex-direction:column;color:var(--ink);}
        body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 85% 15%,rgba(201,168,76,0.1),transparent 55%),radial-gradient(circle at 5% 85%,rgba(196,98,45,0.07),transparent 50%);pointer-events:none;}
        body::after{content:'';position:fixed;inset:0;z-index:0;background-image:radial-gradient(circle,#c9a84c18 1px,transparent 1px);background-size:24px 24px;pointer-events:none;}

        .navbar{position:sticky;top:0;z-index:100;background:rgba(245,240,232,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,0.15);padding:0 32px;height:62px;display:flex;align-items:center;}
        .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
        .brand-icon{width:34px;height:34px;background:var(--ink);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:1rem;}
        .brand-name{font-size:1rem;font-weight:800;color:var(--ink);}

        .page{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px;}

        .card{background:white;border:1.5px solid var(--border);border-radius:24px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.07);}
        .card-header{background:var(--ink);padding:28px 32px;text-align:center;}
        .card-icon{width:56px;height:56px;background:rgba(201,168,76,0.15);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.5rem;}
        .card-title{font-size:1.1rem;font-weight:800;color:#e8edf2;margin-bottom:4px;}
        .card-sub{font-size:11px;color:#4a5568;}

        .card-body{padding:28px 32px;}

        .flash{padding:12px 16px;border-radius:12px;margin-bottom:20px;font-size:12px;font-weight:600;display:flex;align-items:flex-start;gap:8px;}
        .flash.error{background:rgba(196,98,45,0.08);border:1px solid rgba(196,98,45,0.2);color:var(--rust);}

        .field{margin-bottom:16px;}
        .field-label{display:block;font-size:11px;font-weight:700;color:var(--ink);margin-bottom:6px;}
        .field-wrap{position:relative;}
        .field-input{width:100%;padding:12px 44px 12px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--ink);transition:all 0.2s;background:var(--mist);}
        .field-input:focus{outline:none;border-color:var(--gold);background:white;box-shadow:0 0 0 3px rgba(201,168,76,0.1);}
        .toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;}
        .toggle-pw:hover{color:var(--ink);}

        /* Force indicator */
        .pw-strength{margin-top:6px;}
        .pw-bar{height:4px;border-radius:50px;background:var(--mist);overflow:hidden;margin-bottom:4px;}
        .pw-fill{height:100%;border-radius:50px;transition:all 0.3s;width:0%;}
        .pw-fill.weak{background:var(--rust);width:33%;}
        .pw-fill.medium{background:var(--gold);width:66%;}
        .pw-fill.strong{background:var(--green);width:100%;}
        .pw-label{font-size:10px;color:var(--muted);}

        .btn-submit{width:100%;padding:13px;background:var(--ink);color:var(--gold);border:none;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
        .btn-submit:hover{background:#1a2332;transform:translateY(-1px);}
        .btn-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

        .rules{background:var(--mist);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:11px;color:var(--muted);line-height:1.8;}
        .rule{display:flex;align-items:center;gap:6px;}
        .rule.ok{color:var(--green);}
        .rule i{font-size:10px;}
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand">
        <div class="brand-icon">🎓</div>
        <span class="brand-name">EduBulletin</span>
    </a>
</nav>

<div class="page">
    <div class="card">
        <div class="card-header">
            <div class="card-icon">🔑</div>
            <div class="card-title">Nouveau mot de passe</div>
            <div class="card-sub">Choisissez un mot de passe sécurisé</div>
        </div>
        <div class="card-body">

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="flash {{ cat }}">
                <i class="bi bi-exclamation-circle"></i>
                <span>{{ msg }}</span>
            </div>
            {% endfor %}
            {% endwith %}

            <form method="POST" id="resetForm" onsubmit="return validateForm()">

                <div class="field">
                    <label class="field-label">Nouveau mot de passe *</label>
                    <div class="field-wrap">
                        <input type="password" name="password" id="pw1" class="field-input"
                               placeholder="Minimum 6 caractères" required
                               oninput="checkStrength()">
                        <button type="button" class="toggle-pw" onclick="toggleVisi('pw1', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="pw-strength">
                        <div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div>
                        <div class="pw-label" id="pwLabel">Entrez un mot de passe</div>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">Confirmer le mot de passe *</label>
                    <div class="field-wrap">
                        <input type="password" name="password_confirm" id="pw2" class="field-input"
                               placeholder="Répéter le mot de passe" required
                               oninput="checkMatch()">
                        <button type="button" class="toggle-pw" onclick="toggleVisi('pw2', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div style="font-size:10px;margin-top:4px;" id="matchMsg"></div>
                </div>

                <div class="rules" id="rulesBox">
                    <div class="rule" id="rule-len"><i class="bi bi-circle"></i> Au moins 6 caractères</div>
                    <div class="rule" id="rule-match"><i class="bi bi-circle"></i> Les deux mots de passe identiques</div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit" disabled>
                    <i class="bi bi-check-lg"></i> Enregistrer le nouveau mot de passe
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function toggleVisi(inputId, btn) {
    const input = document.getElementById(inputId);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.innerHTML = isText ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
}

function checkStrength() {
    const pw = document.getElementById('pw1').value;
    const fill = document.getElementById('pwFill');
    const label = document.getElementById('pwLabel');
    const rule = document.getElementById('rule-len');

    if (pw.length === 0) {
        fill.className = 'pw-fill'; fill.style.width = '0%';
        label.textContent = 'Entrez un mot de passe';
        rule.className = 'rule';
    } else if (pw.length < 6) {
        fill.className = 'pw-fill weak';
        label.style.color = '#c4622d';
        label.textContent = 'Trop court';
        rule.className = 'rule';
        rule.querySelector('i').className = 'bi bi-x-circle';
    } else if (pw.length < 10) {
        fill.className = 'pw-fill medium';
        label.style.color = '#c9a84c';
        label.textContent = 'Moyen';
        rule.className = 'rule ok';
        rule.querySelector('i').className = 'bi bi-check-circle-fill';
    } else {
        fill.className = 'pw-fill strong';
        label.style.color = '#228B22';
        label.textContent = 'Fort ✓';
        rule.className = 'rule ok';
        rule.querySelector('i').className = 'bi bi-check-circle-fill';
    }
    checkMatch();
}

function checkMatch() {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const msg = document.getElementById('matchMsg');
    const rule = document.getElementById('rule-match');
    const btn = document.getElementById('btnSubmit');

    const lenOk   = pw1.length >= 6;
    const matchOk = pw1 === pw2 && pw2.length > 0;

    if (pw2.length === 0) {
        msg.textContent = '';
        rule.className = 'rule';
    } else if (matchOk) {
        msg.textContent = '✓ Identiques';
        msg.style.color = '#228B22';
        rule.className = 'rule ok';
        rule.querySelector('i').className = 'bi bi-check-circle-fill';
    } else {
        msg.textContent = '✗ Ne correspondent pas';
        msg.style.color = '#c4622d';
        rule.className = 'rule';
        rule.querySelector('i').className = 'bi bi-x-circle';
    }

    btn.disabled = !(lenOk && matchOk);
}

function validateForm() {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    if (pw1 !== pw2) { alert('Les mots de passe ne correspondent pas.'); return false; }
    if (pw1.length < 6) { alert('Le mot de passe doit contenir au moins 6 caractères.'); return false; }
    return true;
}
</script>
</body>
</html>
