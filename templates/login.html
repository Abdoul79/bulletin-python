<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion | École</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #20c997);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            color: #fff;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h3 {
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            padding-left: 45px;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .btn-login {
            border-radius: 12px;
            font-weight: 500;
            padding: 10px;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="login-card text-center">

                <div class="logo">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>

                <h3 class="mb-3">Connexion École</h3>
                <p class="mb-4 opacity-75">Accédez à votre espace sécurisé</p>

                <!-- Flash messages Flask -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, msg in messages %}
                            <div class="alert alert-{{ 'danger' if category=='error' else 'success' }} py-2">
                                {{ msg }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">

                    <div class="mb-3 position-relative">
                        <i class="bi bi-envelope-fill input-icon"></i>
                        <input type="email" name="email" class="form-control" placeholder="Adresse email" required>
                    </div>

                    <div class="mb-3 position-relative">
                        <i class="bi bi-lock-fill input-icon"></i>
                        <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
                    </div>

                    <button type="submit" class="btn btn-light btn-login w-100 mt-3">
                        <i class="bi bi-box-arrow-in-right"></i> Se connecter
                    </button>

                </form>

                <small class="d-block mt-4 opacity-75">
                    © {{ year if year else "2025" }} — Plateforme scolaire
                </small>

            </div>
        </div>
    </div>
</div>

</body>
</html>
